global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '__SMTP_GMAIL_USER__'
  smtp_auth_username: '__SMTP_GMAIL_USER__'
  smtp_auth_password_file: '/run/secrets/gmail_app_password'
  smtp_require_tls: true
  resolve_timeout: 5m

route:
  receiver: gmail
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: gmail
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] Fitwork: {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          Alert: {{ .Labels.alertname }}
          Status: {{ .Status }}
          Severity: {{ .Labels.severity }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ range .Labels.SortedPairs }}{{ .Name }}: {{ .Value }}
          {{ end }}
          Started: {{ .StartsAt }}
          {{ if eq .Status "resolved" }}Resolved: {{ .EndsAt }}{{ end }}
          Source: {{ .GeneratorURL }}
          {{ end }}
