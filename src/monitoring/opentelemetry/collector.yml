receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 4000
    spike_limit_mib: 500
  batch:
exporters:
  otlp_grpc/alloy:
    endpoint: alloy:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/alloy]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_grpc/alloy]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/alloy]
