groups:
  - name: fitWork-nestjs-api-alerts
    rules:
      - alert: TelemetryPipelineDown
        expr: up{job="alloy"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Grafana Alloy {{ $labels.instance }} is down'
          description: 'Prometheus cannot scrape Grafana Alloy for more than 1 minute'

      - alert: BackendTelemetryMissing
        expr: absent(nodejs_eventloop_utilization_ratio{service_name="fitwork-nestjs-api"}) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'FitWork backend telemetry is missing'
          description: 'The backend runtime metric is absent and the alert has remained active for 2 minutes'

      - alert: HighRequestLatency
        expr: |
          (
            sum by (service_name) (
              rate(http_server_request_duration_seconds_sum{service_name="fitwork-nestjs-api"}[5m])
            )
            /
            sum by (service_name) (
              rate(http_server_request_duration_seconds_count{service_name="fitwork-nestjs-api"}[5m])
            ) > 2
          )
          and on (service_name)
          sum by (service_name) (
            increase(http_server_request_duration_seconds_count{service_name="fitwork-nestjs-api"}[5m])
          ) >= 20
        for: 1m
        keep_firing_for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High request latency on {{ $labels.service_name }}'
          description: 'Average request latency is above 2 seconds with at least 20 requests in 5 minutes'

      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis exporter {{ $labels.instance }} is down'
          description: 'Prometheus cannot scrape Redis exporter for more than 1 minute'

      - alert: RedisDown
        expr: redis_up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis {{ $labels.instance }} is down'
          description: 'Redis exporter cannot reach Redis for more than 1 minute'

      - alert: HTTPErrorRate
        expr: |
          (
            sum by (service_name) (
              rate(http_server_request_duration_seconds_count{service_name="fitwork-nestjs-api",http_response_status_code=~"5.."}[5m])
            )
            /
            sum by (service_name) (
              rate(http_server_request_duration_seconds_count{service_name="fitwork-nestjs-api"}[5m])
            ) > 0.05
          )
          and on (service_name)
          sum by (service_name) (
            increase(http_server_request_duration_seconds_count{service_name="fitwork-nestjs-api"}[5m])
          ) >= 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'High HTTP 5xx rate on {{ $labels.service_name }}'
          description: 'More than 5% of requests failed with HTTP 5xx among at least 20 requests in 5 minutes'
