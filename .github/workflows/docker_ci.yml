name: Docker CI & Push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-change:
    name: Scan File Change
    runs-on: ubuntu-latest
    outputs:
      is_Dockerfile_changed: ${{ steps.filter.outputs.backend_code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            backend_code:
              - 'src/**'
              - 'scripts/**'
              - 'prisma/**'
              - 'prisma.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'nest-cli.json'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker_ci.yml'

  build-and-push:
    needs: detect-change
    if: needs.detect-change.outputs.is_Dockerfile_changed == 'true'
    runs-on: ubuntu-latest
    name: Docker Build & Push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt Buildx để tận dụng cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Đăng nhập Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fitwork-be-nestjs-api
          tags: |
            type=raw,value=latest

      # 3. Build và Push
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile # Đường dẫn file Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }} # Lấy kết quả của Docker Meta
          # Bật Cache để lần sau build nhanh hơn
          cache-from: type=gha
          cache-to: type=gha,mode=max
