name: smart-portal

services:
  FitWork-Nestjs-api:
    container_name: Fitwork-backend-nestjs
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    depends_on:
      - database
      - redis
    networks:
      - Fitwork-backend

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    container_name: Fitwork-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - Fitwork-backend

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.6.1-alpine
    container_name: redis-fitwork-nestjs
    ports:
      - '6379:6379'
    networks:
      - Fitwork-backend
    volumes:
      - redis_data:/data

networks:
  Fitwork-backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
