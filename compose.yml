name: smart-portal

services:
  fitwork-nestjs-api:
    container_name: Fitwork-backend-nestjs
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-fitwork-nestjs-api}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,serviceinstance,container
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - Fitwork-backend

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    container_name: Fitwork-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - Fitwork-backend

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.6.1-alpine
    container_name: redis-fitwork-nestjs
    ports:
      - '6379:6379'
    networks:
      - Fitwork-backend
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@localhost:6379
    command:
      redis-server --requirepass ${REDIS_PASSWORD}

    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:v1.41.0
    container_name: redis-exporter
    ports:
      - '9121:9121'
    networks:
      - Fitwork-backend
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-fitwork-nestjs
    ports:
      - '3000:3000'
    networks:
      - Fitwork-monitoring
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    depends_on:
      prometheus:
        condition: service_started


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-fitwork-nestjs
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/var/lib/prometheus'
      - '--web.enabled-remote-write-receiver'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    networks:
      - Fitwork-monitoring
      - Fitwork-backend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rule.yml:/etc/prometheus/alert.rule.yml:ro
      - prometheus_data:/var/lib/prometheus
    depends_on:
      redis_exporter:
        condition: service_started
      otel-collector:
        condition: service_started

  otel-collector:
      image: otel/opentelemetry-collector:latest
      container_name: otel-collector-fitwork-nestjs
      ports:
        - '127.0.0.1:${OTEL_PORT:-4317}:4317'
      networks:
        - Fitwork-monitoring
        - Fitwork-backend
      volumes:
        - ./monitoring/opentelemetry/collector.yml:/etc/otelcol/config.yaml:ro
      depends_on:
        alloy:
          condition: service_started

  alloy:
    image: grafana/alloy:latest
    container_name: alloy-fitwork-nestjs
    ports:
      - '127.0.0.1:${ALLOY_PORT:-4201}:4201'
    command:
      - run
      - '--server.http.listen-addr=0.0.0.0:4201'
      - '--storage.path=/var/lib/alloy/data'
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data:rw
    networks:
      - Fitwork-monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki-fitwork-nestjs
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    networks:
      - Fitwork-monitoring
    command:
      - '--config.file=/etc/loki/config.yml'
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/var/lib/loki/data:rw

  jaeger:
      image: jaegertracing/all-in-one:latest
      container_name: interviewiq-jaeger
      ports:
        - '127.0.0.1:${JAEGER_PORT:-16686}:16686'
      networks:
        - Fitwork-monitoring
      environment:
        - COLLECTOR_OTLP_ENABLED=true

networks:
  Fitwork-backend:
    driver: bridge
  Fitwork-monitoring:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  loki_data:
  prometheus_data:
  alloy_data:
